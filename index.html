<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NegoTrip Relationship Engine</title>
  <meta name="description" content="LinkedIn-assisted connection, follow-up and nurturing CRM for NegoTrip and research networking. LinkedIn stays human-operated.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5e7a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3ERE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">RE</div>
        <div>
          <div class="brand-name">Relationship Engine</div>
          <div class="brand-sub">NegoTrip · Research</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Not connected</span></div>
        <div id="sync-text" class="faint"></div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="banner"></div>
      <div id="view"></div>
    </main>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Main navigation"></nav>
  <div id="drawer-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="demo.js"></script>
  <script src="app.js"></script>

</html>
